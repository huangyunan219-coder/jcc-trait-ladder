name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: node --check dist/app.js
      - run: node --check dist/worker.js
      - run: node --check dist/rewards.js
